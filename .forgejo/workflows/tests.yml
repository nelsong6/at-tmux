name: Tests

# Every test, against master as it stands. Nothing waits for this: a change reaches
# the PCs through ci.yml, and a failure here shows in Alerts. Nelson's decision,
# TMUX-128: one user, so tests don't hold a change back.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  # upstairspc, host mode: the job uses the machine's Visual Studio Build Tools
  # and Git for Windows and installs nothing system-wide.
  build-and-test:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      _CL_: /MP4
      # tmux.exe loads conpty.dll and OpenConsole.exe from its own folder
      # (the pseudoconsole Windows Terminal ships); the package carries them.
      CONPTY_VERSION: 1.25.260930003
    # The runner's account has an interactive pwsh profile (the home shell),
    # which a step must not load; act adds no .ps1 to a custom shell's script.
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"

    steps:
      - uses: actions/checkout@v4

      # On the runner's PATH, bash is WSL's launcher and cmake is MinGW's: put
      # Git Bash and Visual Studio's CMake first. Visual Studio's vcpkg has no
      # classic mode, so libevent comes from vcpkg.json (manifest mode), with a
      # binary cache that persists in the runner's folder.
      - name: Toolchain
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw 'Visual Studio Build Tools not found' }
          "$env:ProgramFiles\Git\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $cache = "$env:USERPROFILE\.forgejo-runner\vcpkg-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$vs\VC\vcpkg" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build Debug
        run: |
          cmake --build build --config Debug

      - name: Build Release
        run: |
          cmake --build build --config Release

      - name: Run key trace tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-key-trace.sh

      - name: Run basic regression tests
        shell: bash
        run: |
          [ -n "$MSYSTEM" ] || { echo "::error::bash is not Git Bash: $(command -v bash)"; exit 1; }
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-basic.sh

      - name: Run Claude swarm simulation tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-claude-swarm.sh

      - name: Run format string tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-format-strings.sh

      - name: Run config syntax tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-conf-syntax.sh

      - name: Run config line ending tests
        shell: bash
        timeout-minutes: 5
        run: TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh conf-crlf.sh

      - name: Run console shutdown tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-pty-close.sh

      - name: Run key handling tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-keys.sh

      - name: Run kitty key form tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-csi-u.sh

      - name: Run late terminal option tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-late-terminal.sh

      - name: Run detach-client -E tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-detach-exec.sh

      - name: Run has-session tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-has-session.sh

      - name: Run file tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-file.sh

      - name: Run strftime tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-strftime.sh
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-char-width.sh

      - name: Run clock mode tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-clock.sh

      - name: Run respawn-failed tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-respawn-failed.sh

      - name: Run persistent error log tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-message-log.sh

      - name: Run background run-shell tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-run-shell-background.sh

      - name: Run layout tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-layout.sh

      - name: Run control client tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-control-client.sh

      - name: Run attach size tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-attach-size.sh

      - name: Run wrap tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-wrap.sh

      - name: Client name tests
        shell: bash
        timeout-minutes: 3
        run: TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-client-name.sh

      - name: Keep clears within Windows panes
        shell: bash
        timeout-minutes: 5
        run: TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-pane-clear.sh

      - name: Keep pane output out of a popup
        shell: bash
        timeout-minutes: 5
        run: TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-popup-output.sh

      - name: Run line size tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-linesize.sh

      - name: Run palette tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-palette.sh

      - name: Run process watch tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-process-watch.sh

      - name: Run child environment tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-environment.sh

      - name: Run child executable path tests
        shell: bash
        timeout-minutes: 5
        run: TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-child-path.sh

      - name: Run keep-alive tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-keep-alive.sh

      - name: Run set-status tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-set-status.sh

      - name: Run caller and play-sound tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-caller.sh

      - name: Run reorder-session tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-reorder-session.sh

      - name: Run session-set tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-session-set.sh

      - name: Run restore programs tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-restore-programs.sh

      - name: Run session-set offer tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-session-offer.sh

      - name: Run session-set ended tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-session-ended.sh

      - name: Run restore-set tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-restore-set.sh

      - name: Run busy server tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-busy-server.sh

      - name: Run new-window -W tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-new-window-draw.sh

      - name: Run new-window -o tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-new-window-options.sh

      - name: Run system app tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-system-app.sh

      - name: Run global key foreground tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-global-foreground.sh

      - name: Run start-program tests
        shell: bash
        timeout-minutes: 5
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-run.sh win32-start-program.sh

      - name: Fetch ConPTY
        run: |
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Windows.Console.ConPTY/$env:CONPTY_VERSION" -OutFile conpty.zip
          Expand-Archive conpty.zip conpty

      # A console changes hands only through conpty.dll, so the Debug build
      # runs here beside it, as a release does.
      - name: Run upgrade tests
        shell: bash
        run: |
          mkdir -p build/upgrade
          cp build/Debug/tmux.exe conpty/runtimes/win-x64/native/conpty.dll conpty/build/native/runtimes/x64/OpenConsole.exe build/upgrade/
          TEST_TMUX=./build/upgrade/tmux.exe bash regress/win32-run.sh win32-pty-close.sh || exit 1
          TEST_TMUX=./build/upgrade/tmux.exe bash regress/win32-run.sh win32-pane-clear.sh || exit 1
          TEST_TMUX=./build/upgrade/tmux.exe bash regress/win32-run.sh win32-popup-output.sh || exit 1
          TEST_TMUX=./build/upgrade/tmux.exe bash regress/win32-run.sh win32-upgrade.sh
          TEST_TMUX=./build/upgrade/tmux.exe bash regress/win32-run.sh panel.sh
          TEST_TMUX=./build/upgrade/tmux.exe bash regress/win32-run.sh panel-fill.sh

      - name: Run independent footer tests
        shell: bash
        run: TEST_TMUX=./build/upgrade/tmux.exe bash regress/win32-run.sh win32-pane-footer.sh

      - name: Run flight record tests
        shell: bash
        run: TEST_TMUX=./build/upgrade/tmux.exe bash regress/win32-run.sh win32-flight.sh

      - name: Build cross-version key fixtures
        run: ./regress/build-upgrade-key-fixtures.ps1

      - name: Run cross-version key upgrades
        shell: bash
        timeout-minutes: 5
        run: TEST_TMUX=./build/upgrade/tmux.exe bash regress/win32-run.sh win32-upgrade-keys.sh

      - name: Package Release with ConPTY
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item build/Release/tmux.exe, build/Release/tmux-wer.dll, conpty/runtimes/win-x64/native/conpty.dll, conpty/build/native/runtimes/x64/OpenConsole.exe package/
          # Moved, so nothing finds it at the path stored in the exe, as on a home PC.
          Move-Item build/Release/tmux.pdb package/

      # Defender quarantined an unsigned build as Program:Win32/Contebrew.A!ml
      # and passed the same build signed (TMUX-30). The certificate is at
      # Terminal's, which every home PC trusts.
      - name: Sign the Windows package
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is not set' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:PFX))
          try {
            & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:PFX_PASSWORD package/tmux.exe package/tmux-wer.dll package/conpty.dll package/OpenConsole.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item cert.pfx }
          $signature = Get-AuthenticodeSignature package/tmux.exe
          if (-not $signature.SignerCertificate -or $signature.Status -eq 'HashMismatch') { throw 'tmux.exe has no intact Authenticode signature' }
          Write-Host "Signer $($signature.SignerCertificate.Thumbprint)"

      - name: Run crash log tests
        timeout-minutes: 5
        shell: bash
        run: TEST_TMUX=./package/tmux.exe bash regress/win32-run.sh win32-crash-log.sh

  # Nelson's Linux machine runs this fork too: tmux's own Unix build, with the
  # Linux keyboard (osdep-linux-keys.c, evdev) for -H and the global table.
  # CI has no keyboard, so hold.sh sees no modifier held, as on macOS.
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake pkg-config bison libevent-dev libncurses-dev libutf8proc-dev

      - name: Build
        run: |
          sh autogen.sh
          ./configure --enable-utf8proc
          make -j"$(nproc)"

      # The job runs as root, and a login sh as root takes /etc/profile's "# "
      # prompt, which the tests don't wait for: they run as an unprivileged
      # user, as on GitHub's runner.
      - name: Run config line ending tests
        timeout-minutes: 5
        run: sudo -n -u ubuntu env TEST_TMUX="$PWD/tmux" sh regress/conf-crlf.sh

      - name: Run palette tests
        run: sudo -n -u ubuntu env TEST_TMUX="$PWD/tmux" sh regress/palette.sh

      - name: Run side panel tests
        run: |
          sudo -n -u ubuntu env TEST_TMUX="$PWD/tmux" sh regress/panel.sh
          sudo -n -u ubuntu env TEST_TMUX="$PWD/tmux" sh regress/panel-fill.sh

      - name: Run hold tests
        run: sudo -n -u ubuntu env TEST_TMUX="$PWD/tmux" sh regress/hold.sh

      - name: Run upgrade tests
        run: sudo -n -u ubuntu env TEST_TMUX="$PWD/tmux" sh regress/upgrade.sh

      - name: Test the flight record
        timeout-minutes: 5
        run: sudo -n -u ubuntu env TEST_TMUX="$PWD/tmux" sh regress/flight.sh

      - name: Run play-sound tests
        run: sudo -n -u ubuntu env TEST_TMUX="$PWD/tmux" sh regress/play-sound.sh

      - name: Run Claude attention tests
        run: sudo -n -u ubuntu env TEST_TMUX="$PWD/tmux" sh regress/claude-attention.sh

  report:
    needs: [build-and-test, linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve home services on the home network
        env:
          HOME_FORGEJO_IP: ${{ vars.HOME_FORGEJO_IP }}
        run: |
          if [ -n "$HOME_FORGEJO_IP" ]; then
            printf '%s forgejo.romaine.life ntfy.home.romaine.life\n' "$HOME_FORGEJO_IP" | sudo tee -a /etc/hosts >/dev/null
          fi

      - name: Report to Alerts
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          WINDOWS: ${{ needs.build-and-test.result }}
          LINUX: ${{ needs.linux.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          now=$(date +%s%3N)
          issues='[]'
          if [ "$WINDOWS" != success ] || [ "$LINUX" != success ]; then
            issues=$(jq -n --argjson now "$now" --arg detail "Windows $WINDOWS, Linux $LINUX on master: $RUN" \
              '[{key: "tests", title: "at-tmux tests failed", detail: $detail, severity: "critical", since: $now}]')
          fi
          jq -n --argjson now "$now" --argjson issues "$issues" \
            '{topic: "alert-state", title: "Current alert state", priority: 1, message: ({schema: "at.alerts/v1", kind: "snapshot",
              source: "at-tmux/tests", revision: $now, observed: $now, issues: $issues} | tojson)}' |
            curl -sS --fail -m 15 -o /dev/null -H "Authorization: Bearer $NTFY_TOKEN" -H 'Content-Type: application/json' \
              --data @- https://ntfy.home.romaine.life/
