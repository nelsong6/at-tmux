name: GitHub sync

# A push to master here fast-forwards GitHub's, so the work machines see it. Nothing is
# ever forced: master moving on both sides fails the job and shows in Alerts. The other direction
# is .github/workflows/forgejo-sync.yml.
on:
  push:
    branches: [master]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fast-forward GitHub
        env:
          GITHUB_PUSH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          set -eu
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://forgejo.romaine.life/.extraheader
          export GIT_CONFIG_VALUE_0="Authorization: token $FORGEJO_TOKEN"
          export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_1="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_PUSH_TOKEN" | base64 -w0)"
          github=https://github.com/nelsong6/at-tmux.git
          git init -q sync && cd sync
          git fetch -q https://forgejo.romaine.life/nelsong6/at-tmux.git master
          ours=$(git rev-parse FETCH_HEAD)
          git fetch -q "$github" master
          theirs=$(git rev-parse FETCH_HEAD)
          [ "$ours" = "$theirs" ] && exit 0
          # GitHub is ahead: its own sync carries that.
          git merge-base --is-ancestor "$ours" "$theirs" && exit 0
          git merge-base --is-ancestor "$theirs" "$ours"
          git push -q "$github" "$ours:refs/heads/master"
          echo "GitHub's master moved to $ours"

      - name: Report to Alerts
        if: always()
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          now=$(date +%s%3N)
          issues='[]'
          [ "$JOB_STATUS" = success ] || issues=$(jq -n --argjson now "$now" '[{key: "sync", title: "at-tmux did not sync to GitHub",
            detail: "If master moved on both sides, a session has to merge them.", severity: "critical", since: $now}]')
          jq -n --argjson now "$now" --argjson issues "$issues" \
            '{topic: "alert-state", title: "Current alert state", priority: 1, message: ({schema: "at.alerts/v1", kind: "snapshot",
              source: "repo-sync/at-tmux", revision: $now, observed: $now, issues: $issues} | tojson)}' |
            curl -sS --fail -m 15 -o /dev/null -H "Authorization: Bearer $NTFY_TOKEN" -H 'Content-Type: application/json' \
              --data @- https://ntfy.home.romaine.life/
