name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Starts a run again from the API, as a run the runner dropped: the same as
  # a push when its ref is master.
  workflow_dispatch:

# Master runs go one at a time, so each numbers its release after the
# previous one's tag exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A PR run keeps its package under its tree, so a merge with that tree could release
  # that package; a job's token can't download it yet (TMUX-134), so it builds.
  # Tests don't hold a change back:
  # they run on their own in tests.yml and report to Alerts.
  tested:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}

    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main

      - name: Find the package already built from this tree
        id: find
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          tree=$(git rev-parse 'HEAD^{tree}')
          code=$(curl -sS -o tested.json -w '%{http_code}' -H "Authorization: token $TOKEN" "$api/releases/tags/tested")
          if [ "$code" != 200 ] && [ "$code" != 404 ]; then
            echo "::error::reading the tested packages returned $code"
            exit 1
          fi
          url=$(jq -r --arg name "$tree.zip" '.assets[]? | select(.name == $name) | .browser_download_url' tested.json)
          if [ -z "$url" ]; then
            echo "$tree has no package; this run builds it"
            exit 0
          fi
          if ! curl -fsSL -H "Authorization: token $TOKEN" -o tested.zip "$url"; then
            echo "::warning::$tree has a package this job can't download; this run builds it"
            exit 0
          fi
          unzip -q tested.zip -d package
          echo "$tree was built in a PR run; releasing its package"
          echo found=true >> "$GITHUB_OUTPUT"

      - name: Make it this run's package
        if: steps.find.outputs.found == 'true'
        uses: forgejo/upload-artifact@v4
        with:
          name: tmux-windows
          path: package/

  # upstairspc, host mode: the job uses the machine's Visual Studio Build Tools
  # and Git for Windows and installs nothing system-wide.
  build:
    needs: tested
    if: needs.tested.outputs.found != 'true'
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      _CL_: /MP4
      # tmux.exe loads conpty.dll and OpenConsole.exe from its own folder
      # (the pseudoconsole Windows Terminal ships); the package carries them.
      CONPTY_VERSION: 1.25.260930003
    # The runner's account has an interactive pwsh profile (the home shell),
    # which a step must not load; act adds no .ps1 to a custom shell's script.
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"

    steps:
      - uses: actions/checkout@v4

      # On the runner's PATH, bash is WSL's launcher and cmake is MinGW's: put
      # Git Bash and Visual Studio's CMake first. Visual Studio's vcpkg has no
      # classic mode, so libevent comes from vcpkg.json (manifest mode), with a
      # binary cache that persists in the runner's folder.
      - name: Toolchain
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw 'Visual Studio Build Tools not found' }
          "$env:ProgramFiles\Git\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $cache = "$env:USERPROFILE\.forgejo-runner\vcpkg-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$vs\VC\vcpkg" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build Release
        run: |
          cmake --build build --config Release

      - name: Fetch ConPTY
        run: |
          Invoke-WebRequest "https://artifacts.home.romaine.life/nuget/nuget/v3/flatcontainer/microsoft.windows.console.conpty/$env:CONPTY_VERSION/microsoft.windows.console.conpty.$env:CONPTY_VERSION.nupkg" -OutFile conpty.zip
          Expand-Archive conpty.zip conpty

      - name: Package Release with ConPTY
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item build/Release/tmux.exe, build/Release/tmux-wer.dll, conpty/runtimes/win-x64/native/conpty.dll, conpty/build/native/runtimes/x64/OpenConsole.exe package/
          # Moved, so nothing finds it at the path stored in the exe, as on a home PC.
          Move-Item build/Release/tmux.pdb package/

      # Defender quarantined an unsigned build as Program:Win32/Contebrew.A!ml
      # and passed the same build signed (TMUX-30). The certificate is at
      # Terminal's, which every home PC trusts.
      - name: Sign the Windows package
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is not set' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:PFX))
          try {
            & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:PFX_PASSWORD package/tmux.exe package/tmux-wer.dll package/conpty.dll package/OpenConsole.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item cert.pfx }
          $signature = Get-AuthenticodeSignature package/tmux.exe
          if (-not $signature.SignerCertificate -or $signature.Status -eq 'HashMismatch') { throw 'tmux.exe has no intact Authenticode signature' }
          Write-Host "Signer $($signature.SignerCertificate.Thumbprint)"

      - name: Upload Release package
        uses: forgejo/upload-artifact@v4
        with:
          name: tmux-windows
          path: package/

  # The package arrives signed, so nothing here needs Windows or waits for
  # upstairspc's slots.
  release:
    needs: [tested, build]
    # build is skipped when tested found the package.
    if: ${{ !failure() && !cancelled() }}
    outputs:
      release-tag: ${{ steps.release.outputs.tag || 'validation-only' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Releases are numbered on the tmux version the fork is built on (v3.6a.1,
      # v3.6a.2, ...), so a new tmux base starts a new series. A commit that
      # already has a number keeps it.
      - name: Version
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: |
          base=$(sed -n 's/.*PACKAGE_VERSION="\([^"-]*\).*/\1/p' CMakeLists.txt)
          [ -n "$base" ] || { echo "::error::CMakeLists.txt has no PACKAGE_VERSION"; exit 1; }
          prefix="v$base"
          pattern="^${prefix//./\\.}\.[0-9]+$"
          if [ "$PUBLISH" != true ]; then
            version="validation-$(git rev-parse --short=7 HEAD)"
          else
            version=$(git tag --points-at HEAD | grep -E "$pattern" | sort -V | tail -1 || true)
            if [ -z "$version" ]; then
              last=$(git tag -l | grep -E "$pattern" | sort -V | tail -1 || true)
              version="$prefix.$(( ${last##*.} + 1 ))"
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      - uses: forgejo/download-artifact@v4
        with:
          name: tmux-windows
          path: package

      - name: Package
        run: |
          for f in tmux.exe tmux.pdb tmux-wer.dll conpty.dll OpenConsole.exe; do
            [ -f "package/$f" ] || { echo "::error::package/$f is missing"; exit 1; }
          done
          zip="tmux-windows-$VERSION.zip"
          (cd package && zip -q "../$zip" tmux.exe tmux.pdb tmux-wer.dll conpty.dll OpenConsole.exe)
          hash=$(sha256sum "$zip" | cut -d' ' -f1)
          echo "$hash  $zip" > "$zip.sha256"
          echo "Packaged $zip; SHA256 $hash"

      - name: Release
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          zip="tmux-windows-$VERSION.zip"
          code=$(curl -sS -o release.json -w '%{http_code}' -H "$auth" "$api/releases/tags/$VERSION")
          if [ "$code" = 404 ]; then
            # A draft release creates no tag: take the number first, so a later
            # run sees it taken even if this release fails. A number another run
            # took makes this fail rather than share it.
            if ! git show-ref --verify --quiet "refs/tags/$VERSION"; then
              jq -n --arg tag "$VERSION" --arg sha "$GITHUB_SHA" '{tag_name: $tag, target: $sha}' |
                curl -fsS -H "$auth" -H 'Content-Type: application/json' -d @- -o /dev/null "$api/tags"
            fi
            hash=$(sha256sum "$zip" | cut -d' ' -f1)
            body=$(printf 'Commit %s\n\nSHA256 of %s: %s' "$GITHUB_SHA" "$zip" "$hash")
            jq -n --arg tag "$VERSION" --arg sha "$GITHUB_SHA" --arg body "$body" \
              '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body, draft: true}' |
              curl -fsS -H "$auth" -H 'Content-Type: application/json' -d @- -o release.json "$api/releases"
          elif [ "$code" != 200 ]; then
            echo "::error::reading release $VERSION returned $code"
            exit 1
          fi
          id=$(jq -r .id release.json)
          for f in "$zip" "$zip.sha256"; do
            if jq -e --arg f "$f" 'any(.assets[]?; .name == $f)' release.json > /dev/null; then
              echo "$f is already on release $VERSION"
            else
              curl -fsS -H "$auth" -F "attachment=@$f" -o /dev/null "$api/releases/$id/assets?name=$f"
              echo "uploaded $f"
            fi
          done
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      # The draft "tested" release is never published, and keeps the newest 20.
      - name: Keep the package for this tree's merge
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          tree=$(git rev-parse 'HEAD^{tree}')
          code=$(curl -sS -o tested.json -w '%{http_code}' -H "$auth" "$api/releases/tags/tested")
          if [ "$code" = 404 ]; then
            curl -fsS -H "$auth" -H 'Content-Type: application/json' -o tested.json "$api/releases" \
              -d '{"tag_name": "tested", "target_commitish": "master", "name": "Packages built by PR runs", "draft": true}'
          elif [ "$code" != 200 ]; then
            echo "::error::reading the tested packages returned $code"
            exit 1
          fi
          id=$(jq -r .id tested.json)
          if ! jq -e --arg name "$tree.zip" 'any(.assets[]?; .name == $name)' tested.json > /dev/null; then
            curl -fsS -H "$auth" -F "attachment=@tmux-windows-$VERSION.zip" -o /dev/null "$api/releases/$id/assets?name=$tree.zip"
          fi
          for old in $(jq -r '.assets // [] | sort_by(.created_at) | reverse | .[20:][] | .id' tested.json); do
            curl -sS -X DELETE -H "$auth" -o /dev/null "$api/releases/$id/assets/$old"
          done
          echo "$tree kept on release $id"

  home-sync:
    needs: release
    uses: romaine-life/pipeline-templates/.forgejo/workflows/home-sync.yml@main
    secrets: inherit
    with:
      release-tag: ${{ needs.release.outputs.release-tag != 'validation-only' && needs.release.outputs.release-tag || '' }}
