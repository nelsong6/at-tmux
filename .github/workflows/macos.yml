# The work Mac runs this fork too (OpenProject 2181): tmux's own Unix build,
# with the macOS keyboard (osdep-darwin-keys.c) for -H and the global table.
# The binary links Homebrew's libevent and utf8proc, which the Mac keeps.
#
# The rest of CI runs on Forgejo (.forgejo/workflows/ci.yml). This runs on
# GitHub from Forgejo's push mirror, and Forgejo's macos job waits for it.
name: macOS

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install autoconf automake pkgconf libevent utf8proc

      - name: Build
        run: |
          sh autogen.sh
          ./configure --enable-utf8proc
          make -j"$(sysctl -n hw.ncpu)"

      - name: Run config line ending tests
        timeout-minutes: 5
        run: TEST_TMUX="$PWD/tmux" sh regress/conf-crlf.sh

      - name: Run palette tests
        run: TEST_TMUX="$PWD/tmux" sh regress/palette.sh

      - name: Run hold tests
        run: TEST_TMUX="$PWD/tmux" sh regress/hold.sh

      - name: Run upgrade tests
        run: TEST_TMUX="$PWD/tmux" sh regress/upgrade.sh

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: tmux-macos
          path: tmux
